/* VOICE: calm station signage, loud only when you must move

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1122);--panel:light-dark(#f3f4f8,#181b33);--ink:light-dark(#14162b,#eef0fb);--muted:light-dark(#5d6275,#a3a8c3);--line:light-dark(#dfe2ec,#2a2e4d);--go:light-dark(#0c7a52,#3dd39a);--risk:light-dark(#a05d00,#f2b33d);--no:light-dark(#8a8f9e,#6d728c);--bad:light-dark(#c8102e,#ff6b7d);--hero:#14162b;--heroInk:#ffffff}

*{box-sizing:border-box;min-width:0}

button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6950a1;outline-offset:2px}

.nav{display:flex;gap:2px;margin-left:auto}.nav a{padding:10px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}.nav a[aria-current]{background:var(--panel)}

.coach .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.coach button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}.coach button.main{background:#fff;color:#14162b;grid-column:1/-1;min-height:50px}
.coach .meter{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}.coach .meter i{display:block;height:100%;background:#fff;transition:width .6s}
.money{margin-top:26px;border:1px solid var(--line);border-radius:18px;padding:14px}
.money h2{margin:0;font-size:20px}.money .tot{font-size:30px;font-weight:800;color:var(--go)}
.jr{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.jr .qs{display:flex;gap:6px;flex-wrap:wrap}.jr .qs button{min-height:36px;padding:0 10px;font-size:14px}.jr .qs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.jr .owed{font-weight:800}.jr input{width:90px;min-height:36px}
.carbox{display:flex;gap:3px;margin:8px 0}.carbox span{flex:1;height:30px;border-radius:6px;background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:800}.carbox span.hit{background:var(--go);color:#fff}

.dest{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.coaches{display:flex;gap:3px;margin:8px 0}.coaches span{flex:1;height:26px;border-radius:5px;background:var(--panel);position:relative;overflow:hidden;font-size:11px;display:grid;place-items:center;font-weight:600}

<script>
{
const TFL = 'https://api.tfl.gov.uk';
const RDM = 'https://api1.raildata.org.uk/';
const RDM_PATHS = ['1010-live-departure-board-dep1_2','1010-live-departure-board-dep','1010-live-departure-board-dep1_1'];
const MODES = [
  {k:'walk', label:'Walk', short:'W', col:'#2f6fde'},
  {k:'run', label:'Run', short:'R', col:'#e0571f'},
  {k:'bike', label:'Bike', short:'B', col:'#0f9d8a'},
  {k:'lift', label:'Lift', short:'L', col:'#8a3fc7'}
];
const LINE_COL = {elizabeth:'#6950a1','elizabeth-line':'#6950a1',bus:'#c8102e',central:'#dc241f',jubilee:'#7b868c',district:'#00782a',hammersmith:'#f589a6',circle:'#d4a900',metropolitan:'#9b0058',northern:'#1c1c1c',piccadilly:'#0019a8',victoria:'#0098d4',bakerloo:'#b36305','waterloo-city':'#4bb5a7',dlr:'#00a4a7',overground:'#ee7c0e',tram:'#5fb526',LE:'#d70428',XR:'#6950a1'};
const DEFAULT = {kg:70, hourValue:12.71, places:[], f:{run:0.55, bike:0.4, drive:0.3}, liftPickup:5, liftOn:false, buffer:30, window:40, darwinKey:'', darwinPath:'', want:0.8};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = () => { try { return Object.assign(structuredClone(DEFAULT), JSON.parse(localStorage.getItem('catchit.v1') || '{}')); } catch (e) { return structuredClone(DEFAULT); } };
const save = () => { try { localStorage.setItem('catchit.v1', JSON.stringify(cfg)); } catch (e) {} };
let cfg = load();
let deps = [];            // merged departures
const kf = {};            // Kalman state per departure key
const shown = {};         // eased display time per key
let wx = {rain:0, temp:null, wind:null};
let demo = false, lastOk = 0, lastErr = '';
let trip = null;          // {placeId, mode, start}
let remind = null;

/* ---------- maths ---------- */
const erf = x => { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; };
const Phi = z => 0.5 * (1 + erf(z / Math.SQRT2));
function modeSecs(p, m) {
  const L = p.learned || {}, W = +p.walk || 0, F = cfg.f;
  let mins;
  if (m === 'walk') mins = L.walk ?? W;
  else if (m === 'run') mins = L.run ?? W * F.run;
  else if (m === 'bike') mins = L.bike ?? W * F.bike;
  else mins = cfg.liftPickup + (L.lift ?? W * F.drive);
  if (m !== 'lift') mins *= phys(p, m, mins).f;
  const wet = (m !== 'lift' && wx.rain > 0.2) ? 1.08 : 1;
  return (mins * wet + (+p.platform || 0)) * 60;
}
function modeSigma(p, m, T) { return 0.12 * T + 20 + (m === 'lift' ? cfg.liftPickup * 15 : 0); }
function modesFor(p) { return MODES.filter(m => p.modes?.[m.k] !== false && (m.k === 'lift' ? cfg.liftOn : cfg.today?.[m.k] !== false)); }
function chance(d, p, m, now) {
  if (d.cancelled) return 0;
  const T = modeSecs(p, m), sm = modeSigma(p, m, T);
  const z = ((d.t - now) / 1000 - T - cfg.buffer) / Math.sqrt(d.sigma ** 2 + sm ** 2);
  return Phi(z);
}
function leaveIn(d, p, m, now) {           // seconds until you must leave for cfg.want chance
  const T = modeSecs(p, m), sm = modeSigma(p, m, T);
  const zq = 0.8416; // z for 80%
  return (d.t - now) / 1000 - T - cfg.buffer - zq * Math.sqrt(d.sigma ** 2 + sm ** 2);
}
function kalman(key, z, sigma) {           // 1D Kalman filter on the predicted departure time (ms)
  const R = (sigma * 1000) ** 2, Q = (10000) ** 2;
  const s = kf[key];
  if (!s || Math.abs(z - s.t) > 180000) { kf[key] = {t: z, P: R}; return z; }
  s.P += Q; const K = s.P / (s.P + R); s.t += K * (z - s.t); s.P *= (1 - K); return s.t;
}
const cls = pr => pr >= 0.8 ? 'g' : pr >= 0.4 ? 'a' : 'n';
const mmss = s => { const neg = s < 0; s = Math.abs(Math.round(s)); const m = Math.floor(s / 60), r = s % 60; return (neg ? '-' : '') + m + ':' + String(r).padStart(2, '0'); };
const hhmm = t => new Date(t).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
function nrTime(hm, now) {
  const [h, m] = hm.split(':').map(Number); const d = new Date(now); d.setHours(h, m, 0, 0);
  let t = d.getTime(); if (t < now - 12 * 3600e3) t += 864e5; if (t > now + 12 * 3600e3) t -= 864e5; return t;
}

/* ---------- feeds ---------- */
async function getJSON(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(r.status + ' ' + url.split('?')[0].slice(0, 60)); return r.json(); }
function keep(p, d) {
  if (!p.only) return true;
  const toks = p.only.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  const hay = (d.line + ' ' + d.dest + ' ' + (d.platform || '')).toLowerCase();
  return toks.some(t => hay.includes(t));
}
async function fromTfl(p, now) {
  const a = await getJSON(TFL + '/StopPoint/' + encodeURIComponent(p.tflId) + '/Arrivals');
  return a.map(x => ({
    key: 'tfl|' + p.id + '|' + x.lineId + '|' + x.vehicleId,
    src: 'TfL', mode: x.modeName, line: x.lineName, lineId: x.lineId,
    colour: LINE_COL[x.lineId] || LINE_COL[x.modeName] || '#3b3f5c',
    dest: (x.destinationName || x.towards || '').replace(/ (Rail|Underground|DLR) Station$/, ''),
    platform: x.modeName === 'bus' ? (x.platformName && x.platformName !== 'null' ? 'Stop ' + x.platformName : '') : x.platformName,
    raw: Date.parse(x.expectedArrival), sigma: x.modeName === 'bus' ? 60 : 45,
    vehicleId: x.vehicleId, placeId: p.id
  }));
}
async function fromDarwin(p, now) {
  if (!cfg.darwinKey || !p.crs) return [];
  const paths = cfg.darwinPath ? [cfg.darwinPath] : RDM_PATHS;
  let data = null, lastE = null;
  for (const path of paths) {
    try { data = await getJSON(RDM + path + '/LDBWS/api/20220120/GetDepBoardWithDetails/' + encodeURIComponent(p.crs.toUpperCase()) + '?numRows=20', {headers: {'x-apikey': cfg.darwinKey}}); cfg.darwinPath = path; save(); break; }
    catch (e) { lastE = e; }
  }
  if (!data) throw lastE || new Error('Darwin');
  return (data.trainServices || []).filter(s => !(p.tflId && s.operatorCode === 'XR')).map(s => {
    const std = nrTime(s.std, now); const etd = s.etd || '';
    const cancelled = s.isCancelled || /cancel/i.test(etd);
    const t = /^\d\d:\d\d$/.test(etd) ? nrTime(etd, now) : std;
    const calls = (s.subsequentCallingPoints?.[0]?.callingPoint || []).map(c => ({name: c.locationName, t: c.st, et: c.et}));
    const hk = p.id + '|' + s.std + '|' + (s.destination?.[0]?.locationName || '');
    if (s.platform) platLog(hk, s.platform);
    const guess = !s.platform ? platGuess(hk) : null;
    return {
      key: 'nr|' + p.id + '|' + s.serviceID, src: 'National Rail', mode: 'rail', line: s.operator || 'Rail', lineId: s.operatorCode,
      colour: LINE_COL[s.operatorCode] || '#3b3f5c', dest: s.destination?.[0]?.locationName || '', platform: s.platform ? 'Platform ' + s.platform : guess ? `Platform tbc, usually ${guess.p} (${guess.n} of ${guess.of})` : 'Platform tbc',
      raw: t, sigma: /delay/i.test(etd) ? 300 : 60, cancelled, status: etd, coaches: +s.length || 0, calls, placeId: p.id, std: s.std
    };
  });
}
/* platform history: which platform each regular service used, counted once per day */
let plat = {}; try { plat = JSON.parse(localStorage.getItem('catchit.plat') || '{}'); } catch (e) {}
function platLog(k, pf) {
  const day = new Date().toISOString().slice(0, 10), h = plat[k] = plat[k] || {days: {}};
  if (h.days[day] === pf) return; h.days[day] = pf;
  const ds = Object.keys(h.days).sort(); while (ds.length > 30) delete h.days[ds.shift()];
  try { localStorage.setItem('catchit.plat', JSON.stringify(plat)); } catch (e) {}
}
function platGuess(k) {
  const h = plat[k]; if (!h) return null; const c = {}; const v = Object.values(h.days); v.forEach(p => c[p] = (c[p] || 0) + 1);
  const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; return top && v.length >= 2 ? {p: top[0], n: top[1], of: v.length} : null;
}
/* Monte Carlo: chance a bus gets you to a train, sampling every uncertain part */
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function connect(busAt, busSigma, walkSecs, train, runs = 4000) {
  let ok = 0;
  for (let i = 0; i < runs; i++) {
    const arrive = busAt + gauss() * busSigma * 1000 + (walkSecs * (1 + 0.12 * gauss())) * 1000 + cfg.buffer * 1000;
    const leave = train.t + gauss() * train.sigma * 1000;
    if (arrive <= leave) ok++;
  }
  return ok / runs;
}
async function refresh() {
  if (demo) { makeDemo(); return; }
  if (!cfg.places.length) { deps = []; render(); return; }
  const now = Date.now(); const out = []; const errs = [];
  await Promise.all(cfg.places.map(async p => {
    const jobs = [];
    if (p.tflId) jobs.push(fromTfl(p, now).catch(e => { errs.push(p.name + ': ' + e.message); return []; }));
    if (p.crs) jobs.push(fromDarwin(p, now).catch(e => { errs.push(p.name + ' (National Rail): ' + e.message); return []; }));
    const lists = await Promise.all(jobs);
    for (const l of lists) for (const d of l) if (keep(p, d)) out.push(d);
  }));
  const win = cfg.window * 60e3;
  deps = out.filter(d => d.raw > now - 60e3 && d.raw < now + win).map(d => { d.t = kalman(d.key, d.raw, d.sigma); return d; }).sort((a, b) => a.t - b.t).slice(0, 14);
  lastErr = errs.join(', '); if (out.length || !errs.length) lastOk = Date.now();
  render();
}
async function weather() {
  const p = cfg.places.find(q => q.lat); if (!p || demo) return;
  try {
    const w = await getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon + '&current=precipitation,temperature_2m,wind_speed_10m,wind_direction_10m');
    wx = {rain: w.current.precipitation, temp: w.current.temperature_2m, wind: w.current.wind_speed_10m, wdir: w.current.wind_direction_10m};
  } catch (e) {}
  // height of each stop above home (Open-Meteo elevation, 90 m DEM) for the hill model
  const need = cfg.home ? cfg.places.filter(q => q.lat && q.dz == null) : [];
  if (need.length) try {
    const pts = [[cfg.home[1], cfg.home[0]], ...need.map(q => [q.lat, q.lon])];
    const r = await getJSON(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(x => x[0].toFixed(5)).join(',')}&longitude=${pts.map(x => x[1].toFixed(5)).join(',')}`);
    need.forEach((q, i) => { q.dz = +(r.elevation[i + 1] - r.elevation[0]).toFixed(1); }); save();
  } catch (e) {}
}

/* ---------- physics of getting there ----------
   wind: hold your effort (power) fixed and solve  c·v + ½ρ·CdA·(v + w)²·v = P0  for v, where w is the headwind
         component along your way (wind speed × cos(wind-from − your bearing)); ρ = 1.225 kg/m³.
   hills: walking and running follow Tobler's hiking function  v ∝ e^(−3.5·|grade + 0.05|);
         cycling adds the climbing force m·g·grade to the same power balance.
   tiredness (running): Riegel  T₂ = T₁·(D₂/D₁)^1.06, measured from a 400 m dash. */
const PHY = {walk: {c: 140, A: 0.24}, run: {c: 266, A: 0.24}, bike: {c: 8, A: 0.4}};  // c: walk/run metabolic cost (N), bike rolling + drivetrain
function solveV(m, v0, w, grade) {
  const k = PHY[m], half = 0.5 * 1.225 * k.A, mg = (cfg.kg + (m === 'bike' ? 12 : 0)) * 9.81;
  const P0 = k.c * v0 + half * v0 ** 3, f = v => (k.c + (m === 'bike' ? mg * grade : 0)) * v + half * (v + w) ** 2 * v - P0;
  let lo = 0.05, hi = v0 * 3; for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (f(mid) > 0) hi = mid; else lo = mid; } return (lo + hi) / 2;
}
const tobler = g => Math.exp(-3.5 * Math.abs(g + 0.05)) / Math.exp(-3.5 * 0.05);
function headwind(bearingDeg) { if (wx.wind == null || wx.wdir == null) return 0; return wx.wind / 3.6 * Math.cos((wx.wdir - bearingDeg) * Math.PI / 180); }
const brgTo = (a, b) => { const r = Math.PI / 180, y = Math.sin((b[0] - a[0]) * r) * Math.cos(b[1] * r), x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos((b[0] - a[0]) * r); return (Math.atan2(y, x) / r + 360) % 360; };
const physCache = new Map();
function phys(p, m, baseMins) { const k = [p.id, m, baseMins.toFixed(2), wx.wind, wx.wdir, p.dz, cfg.kg].join('|'); let r = physCache.get(k); if (!r) { r = phys0(p, m, baseMins); if (physCache.size > 500) physCache.clear(); physCache.set(k, r); } return r; }
function phys0(p, m, baseMins) {      // returns {f: time multiplier, w: headwind m/s, g: grade, D: metres}
  if (m === 'lift' || !cfg.home || !p.lat || !baseMins) return {f: 1};
  const st = [p.lon, p.lat], D = havM(cfg.home, st) * DETOUR; if (D < 60) return {f: 1};
  const v0 = D / (baseMins * 60), w = headwind(brgTo(cfg.home, st)), g = p.dz != null ? p.dz / D : 0;
  // effort is set by a typical speed for the mode (walk 1.4, run 3.3, bike 5.5 m/s); we only use the ratio calm ÷ today,
  // so your own measured times stay the base and the conditions scale them
  const vt = {walk: 1.4, run: 3.3, bike: 5.5}[m];
  let f = 1;
  if (m === 'bike') f = vt / solveV('bike', vt, w, g);
  else f = (vt / solveV(m, vt, w, 0)) / tobler(g);
  if (m === 'run' && !(p.learned || {}).run) f *= Math.max(1, D / 400) ** 0.06;
  return {f: Math.max(0.6, Math.min(1.8, f)), w, g, D};
}
function physNote(p, m) {
  const r = phys(p, m, (+p.walk || 0) * (m === 'run' ? cfg.f.run : m === 'bike' ? cfg.f.bike : 1)); if (!r.D) return '';
  const bits = []; const pct = Math.round((r.f - 1) * 100);
  if (Math.abs(r.w) * 3.6 >= 8) bits.push(`${r.w > 0 ? 'headwind' : 'tailwind'} ${Math.round(Math.abs(r.w) * 3.6)} km/h`);
  if (Math.abs(r.g) >= 0.008) bits.push(`${r.g > 0 ? 'uphill' : 'downhill'} ${(Math.abs(r.g) * 100).toFixed(1)}%`);
  if (!bits.length || Math.abs(pct) < 2) return '';
  return `${bits.join(' and ')} on the way, so ${({walk: 'walking', run: 'running', bike: 'cycling'})[m]} is about ${Math.abs(pct)}% ${pct > 0 ? 'slower' : 'faster'} right now.`;
}

/* ---------- demo (clearly labelled) ---------- */
function makeDemo() {
  const now = Date.now();
  if (!cfg.places.some(p => p.id === 'demo1')) {
    demoPlaces = [{id:'demo1', name:'Demo station', walk:9, platform:2, lat:51.5748, lon:0.1832, modes:{walk:true,run:true,bike:true,lift:true}}, {id:'demo2', name:'Demo bus stop', walk:3, platform:0.5, lat:51.5741, lon:0.1801, modes:{walk:true,run:true,bike:false,lift:false}}];
  }
  if (!demoSeed.length) {
    const base = [[4,'Elizabeth','elizabeth','Heathrow Terminal 5','Platform 4',1],[11,'Elizabeth','elizabeth','Abbey Wood','Platform 4',1],[13,'Greater Anglia','LE','London Liverpool Street','Platform 2',1],[2,'103','bus','Rainham Station','Stop E',2],[7,'175','bus','Dagenham, Ford Works','Stop E',2],[16,'Elizabeth','elizabeth','Heathrow Terminal 5','Platform 4',1],[19,'103','bus','Rainham Station','Stop E',2],[24,'Greater Anglia','LE','London Liverpool Street','Platform 2',1]];
    demoSeed = base.map((b, i) => ({key:'demo|' + i, src:'Demo', mode: b[2] === 'bus' ? 'bus' : 'rail', line:b[1], lineId:b[2], colour: LINE_COL[b[2]], dest:b[3], platform:b[4], raw: now + b[0] * 60e3 + (i * 17e3), sigma: 50, placeId:'demo' + b[5], coaches: b[2] === 'LE' ? 8 : 9, vehicleId: b[2] === 'bus' ? 'DEMO' + i : ''}));
  }
  for (const d of demoSeed) d.raw += (Math.random() - 0.5) * 20e3;
  deps = demoSeed.filter(d => d.raw > now - 60e3).map(d => { d.t = kalman(d.key, d.raw, d.sigma); return d; }).sort((a, b) => a.t - b.t);
  lastOk = now; lastErr = ''; render();
}
let demoPlaces = [], demoSeed = [];
const placeOf = id => id === 'jp' ? jpPlace : cfg.places.find(p => p.id === id) || demoPlaces.find(p => p.id === id);
let jpPlace = null;

/* ---------- best option ---------- */
/* Inbox-style snooze: hide this departure from the call and show the next one (this session only) */
const snoozed = new Set((() => { try { return JSON.parse(sessionStorage.getItem('catchit.snooze') || '[]'); } catch (e) { return []; } })());
function snooze(k) { snoozed.add(k); try { sessionStorage.setItem('catchit.snooze', JSON.stringify([...snoozed])); } catch (e) {} heroDraw(Date.now()); drawSummary(Date.now()); }

/* Dark Sky-style: one plain sentence for the next hour, and a 60-minute strip where each departure is a mark */
const verbOf = k => ({run: 'run', bike: 'cycle', lift: 'get a lift', walk: 'walk'})[k];
function nextHour(now) { return deps.filter(d => !d.cancelled && d.t > now && d.t - now < 3600e3).map(d => { const p = placeOf(d.placeId); return {d, v: p ? verdict(d, p, now) : {cls: 'n'}}; }); }
function drawSummary(now) {
  const el = $('#sum'), st = $('#strip'); if (!el) return;
  if (!deps.length) { el.textContent = ''; st.innerHTML = ''; st.hidden = true; return; }
  const L = nextHour(now), ok = L.filter(x => x.v.cls === 'g' || x.v.cls === 'a'), b = best(now);
  el.innerHTML = ok.length && b ? `<b>Next hour:</b> ${ok.length} ${ok.length === 1 ? 'departure' : 'departures'} you can still catch. The best is the ${hhmm(b.d.t)} ${esc(shortName(b.d))}${b.m.k !== 'walk' ? ' if you ' + verbOf(b.m.k) : ''}.` : '<b>Next hour:</b> nothing you can still catch from here. Try Where to? for another way.';
  if (b) { const pn = physNote(b.p, b.m.k); if (pn) el.innerHTML += `<br><span class="phys">${esc(pn)}</span>`; }
  st.hidden = false;
  if (!st.dataset.built) { st.dataset.built = '1'; st.innerHTML = '<i class="sl"></i>' + [0, 15, 30, 45, 60].map(m => `<span class="sx" style="left:${m / 60 * 100}%">${m ? m + ' min' : 'now'}</span>`).join('') + '<div class="sm" id="sm"></div>'; }

  const pull = async () => {
    if (d.src === 'Demo') { stops = ['Market Place', 'High Street', 'Demo station', 'Church Road', 'Hospital'].map((n, k) => ({name: n, t: Date.now() + (k * 90 + 40) * 1000})); return; }
    try { const a = await getJSON(TFL + '/Vehicle/' + encodeURIComponent(d.vehicleId) + '/Arrivals'); stops = a.map(x => ({name: x.stationName, t: Date.parse(x.expectedArrival)})).filter(x => x.t > Date.now() - 20000).sort((x, y) => x.t - y.t).slice(0, 14); }
    catch (e) { box.textContent = 'Could not load this bus: ' + e.message; }
  };
  const draw = () => {
    if (!stops.length) return; const now = Date.now();
    box.innerHTML = `<ul class="stops" id="fl">${stops.map(s => `<li><span>${esc(s.name)}</span><span>${mmss((s.t - now) / 1000)}</span></li>`).join('')}</ul>`;
    const ul = $('#fl'), lis = ul.querySelectorAll('li'); if (!lis.length) return;
    let y = 0; const first = stops[0];
    if (first.t > now) { const span = 120000; const f = Math.min(1, (first.t - now) / span); y = lis[0].offsetTop - f * 30; }
    const bus = document.createElement('div'); bus.className = 'busnow'; bus.style.background = d.colour; bus.textContent = d.line; bus.style.top = Math.max(-8, y) + 'px'; ul.appendChild(bus);
  };
  await pull(); draw(); connections(d, stops); let n = 0;
  followTimer = setInterval(async () => { if (++n % 20 === 0) await pull(); draw(); }, 1000);
}

function connections(d, stops) {
  const stations = (demo ? demoPlaces : cfg.places).filter(p => !/^490/.test(p.tflId || '') && p.id !== d.placeId);
  for (const st of stations) {
    const word = String(st.name).split(/[ (]/)[0].toLowerCase(); if (word.length < 3) continue;
    const hit = stops.find(s => s.name.toLowerCase().includes(word) && /station/i.test(s.name)) || stops.find(s => s.name.toLowerCase() === st.name.toLowerCase()); if (!hit) continue;
    const trains = deps.filter(x => x.placeId === st.id && !x.cancelled && x.t > hit.t).slice(0, 5); if (!trains.length) continue;
    const walk = (+st.platform || 2) * 60 + 90;
    const html = `<h3>Connections at ${esc(st.name)}</h3><p class="note">This bus reaches ${esc(hit.name)} about ${hhmm(hit.t)}. Chance of then making each train (4,000 simulated trips, including bus lateness, your walk to the platform and train lateness):</p><table style="width:100%;border-collapse:collapse">${trains.map(x => { const pr = connect(hit.t, 90, walk, x); return `<tr><td>${hhmm(x.t)}</td><td>${esc(shortName(x))} to ${esc(x.dest)}</td><td class="${cls(pr)}" style="text-align:right"><b>${Math.round(pr * 100)}%</b></td></tr>`; }).join('')}</table>`;
    const box = document.createElement('div'); box.innerHTML = html; $('#follow')?.after(box);
  }
}

/* ---------- setup drawer ---------- */
function openSetup() { drawSetup(); $('#setup').classList.add('open'); }
function closeSetup() { $('#setup').classList.remove('open'); save(); demo = false; demoSeed = []; refresh(); weather(); }
$('#setup').addEventListener('click', e => { if (e.target.id === 'setup') closeSetup(); });
let near = [];        // nearby stops found for the current home point
let STN = null;       // National Rail station codes (CRS), loaded on demand
async function crsFor(lat, lon) {
  try { if (!STN) STN = await (await fetch('data/stations.json')).json(); } catch (e) { return ''; }
  let best = null, bd = 0.0045; for (const s of STN) { const d = Math.hypot(s[1] - lat, (s[2] - lon) * 0.62); if (d < bd) { bd = d; best = s; } }
  return best ? best[0] : '';
}
const walkMin = m => Math.max(1, Math.round(m * 1.3 / 80));   // straight-line metres to walking minutes (streets add ~30%)
const hav2 = (a, b, c, d) => { const R = 6371000, p = Math.PI / 180, x = Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
function drawSetup() {
  const s = $('#setupSheet');
  const has = id => cfg.places.some(p => p.tflId === id);
  s.innerHTML = `<button class="close" id="sClose">Done</button><h2>Set up in three steps</h2>
  <p class="note">Everything stays in this browser.</p>
  <h3>1. Where do you usually leave from?</h3>
  <div class="grid2"><button id="geo" class="cta">Use my location</button><div class="field" style="margin:0"><input id="pc" placeholder="or type a postcode" autocomplete="postal-code"></div></div>
  <p class="note" id="homeNote">${cfg.home ? 'Home point saved (rounded to about 100 m).' : 'Used only to find stops near you and estimate walking minutes.'}</p>
  <h3>2. Tick the stops and stations you use</h3>
  <div id="near">${near.length ? nearHtml(has) : '<p class="note">Your nearby stops appear here after step 1.</p>'}</div>
  <details><summary>Can't find it? Search by name</summary><div class="field"><input id="q" placeholder="Stop or station name" autocomplete="off"></div><div class="res" id="res"></div></details>
  <h3>3. Check your walking times</h3>
  <div id="places">${cfg.places.map(placeCard).join('') || '<p class="note">Nothing ticked yet.</p>'}</div>
  <details><summary>More settings</summary>
  <div class="grid2">
    <div class="field"><label for="fRun">Running time as share of walking</label><input id="fRun" type="number" step="0.05" min="0.2" max="1" value="${cfg.f.run}"></div>
    <div class="field"><label for="fBike">Cycling time as share of walking</label><input id="fBike" type="number" step="0.05" min="0.1" max="1" value="${cfg.f.bike}"></div>
    <div class="field"><label for="fDrive">Driving time as share of walking</label><input id="fDrive" type="number" step="0.05" min="0.05" max="1" value="${cfg.f.drive}"></div>
    <div class="field"><label for="kg">Your weight in kg (for calories)</label><input id="kg" type="number" min="30" max="200" value="${cfg.kg}"></div>
    <div class="field"><label for="hv">What an hour of your time is worth (£)</label><input id="hv" type="number" step="0.01" min="0" value="${cfg.hourValue}"></div>
    <div class="field"><label for="lp">Lift: minutes until pickup</label><input id="lp" type="number" min="0" max="60" value="${cfg.liftPickup}"></div>
    <div class="field"><label for="buf">Safety buffer (seconds)</label><input id="buf" type="number" min="0" max="180" value="${cfg.buffer}"></div>
    <div class="field"><label for="win">Show the next (minutes)</label><input id="win" type="number" min="10" max="120" value="${cfg.window}"></div>
  </div>
  <h3>Greater Anglia and other National Rail trains</h3>
  <p class="note">Buses, the Elizabeth line and the Tube work without this. For other trains, get a free "Live Departure Board" key at raildata.org.uk and paste it here. Station codes are filled in for you.</p>
  <div class="field"><label for="dk">Rail Data Marketplace consumer key</label><input id="dk" type="password" value="${esc(cfg.darwinKey)}" autocomplete="off"></div>
  </details>
  <p class="note">Data: Powered by TfL Open Data, National Rail Darwin, postcodes.io, Open-Meteo. Station codes © Trainline EU and contributors (ODbL).</p>`;
  $('#sClose').addEventListener('click', closeSetup);
  const num = (id, fn) => $('#' + id).addEventListener('change', e => { const v = parseFloat(e.target.value); if (!isNaN(v)) { fn(v); save(); } });
  num('fRun', v => cfg.f.run = v); num('fBike', v => cfg.f.bike = v); num('fDrive', v => cfg.f.drive = v);
  num('lp', v => cfg.liftPickup = v); num('buf', v => cfg.buffer = v); num('win', v => cfg.window = v);
  $('#kg')?.addEventListener('change', e => { cfg.kg = +e.target.value || 70; save(); });
  $('#hv')?.addEventListener('change', e => { cfg.hourValue = +e.target.value || 0; save(); });
  $('#dk').addEventListener('change', e => { cfg.darwinKey = e.target.value.trim(); cfg.darwinPath = ''; save(); });
  $('#geo').addEventListener('click', () => {
    $('#homeNote').textContent = 'Asking for your location…';
    if (!navigator.geolocation) { $('#homeNote').textContent = 'Location is not available here; type a postcode instead.'; return; }
    navigator.geolocation.getCurrentPosition(pos => setHome(pos.coords.latitude, pos.coords.longitude), () => { $('#homeNote').textContent = 'Location was blocked; type a postcode instead.'; }, {enableHighAccuracy: false, timeout: 10000});
  });
  let tp; $('#pc').addEventListener('input', e => { clearTimeout(tp); tp = setTimeout(() => postcode(e.target.value), 600); });
  let tq; $('#q').addEventListener('input', e => { clearTimeout(tq); tq = setTimeout(() => search(e.target.value), 350); });
  bindNear(); bindPlaces();
}
async function postcode(v) {
  v = v.trim(); if (v.replace(/\s/g, '').length < 5) return;
  try { const r = await getJSON('https://api.postcodes.io/postcodes/' + encodeURIComponent(v)); setHome(r.result.latitude, r.result.longitude); }
  catch (e) { $('#homeNote').textContent = 'Postcode not found yet, keep typing.'; }
}
async function setHome(lat, lon) {
  cfg.home = [+lon.toFixed(3), +lat.toFixed(3)]; save();
  $('#homeNote').textContent = 'Finding stops near you…';
  try {
    const [buses, rail] = await Promise.all([
      getJSON(`${TFL}/StopPoint?lat=${lat}&lon=${lon}&stopTypes=NaptanPublicBusCoachTram&radius=600`),
      getJSON(`${TFL}/StopPoint?lat=${lat}&lon=${lon}&stopTypes=NaptanMetroStation,NaptanRailStation&radius=2500`)]);
    near = [...(rail.stopPoints || []), ...(buses.stopPoints || []).filter(s => (s.lines || []).length)].map(s => ({
      id: s.naptanId, name: s.commonName.replace(/ (Rail|Underground|DLR) Station$/, ''), letter: s.indicator && !/^->/.test(s.indicator) ? s.indicator : '',
      towards: (s.additionalProperties || []).find(a => a.key === 'Towards')?.value || '', lines: (s.lines || []).map(l => l.name), modes: s.modes || [],
      dist: hav2(lat, lon, s.lat, s.lon), lat: s.lat, lon: s.lon, rail: s.stopType !== 'NaptanPublicBusCoachTram'})).sort((a, b) => (b.rail - a.rail) || a.dist - b.dist).slice(0, 18);
    $('#homeNote').textContent = 'Home point saved (rounded to about 100 m). Tick what you use below.';
    $('#near').innerHTML = nearHtml(id => cfg.places.some(p => p.tflId === id)); bindNear();
  } catch (e) { $('#homeNote').textContent = 'Could not reach TfL: ' + e.message; }
}
function nearHtml(has) {
  return '<div class="nearlist">' + near.map((s, i) => `<label class="nearitem"><input type="checkbox" data-n="${i}" ${has(s.id) ? 'checked' : ''}>
    <span><b>${esc(s.name)}${s.letter ? ' · ' + esc(s.letter) : ''}</b><span class="note">${s.rail ? esc(s.lines.join(', ')) : 'Buses ' + esc(s.lines.slice(0, 8).join(', ')) + (s.towards ? ' · towards ' + esc(s.towards) : '')}</span></span>
    <span class="wm">${walkMin(s.dist)} min walk</span></label>`).join('') + '</div>';
}
function bindNear() {
  document.querySelectorAll('[data-n]').forEach(c => c.addEventListener('change', async () => {
    const s = near[+c.dataset.n];
    if (!c.checked) { cfg.places = cfg.places.filter(p => p.tflId !== s.id); save(); $('#places').innerHTML = cfg.places.map(placeCard).join(''); bindPlaces(); return; }
    const hasTfl = s.modes.some(m => ['elizabeth-line', 'tube', 'overground', 'dlr', 'tram', 'bus'].includes(m));
    const crs = s.modes.includes('national-rail') ? await crsFor(s.lat, s.lon) : '';
    addPlace({name: s.name + (s.letter ? ' (' + s.letter + ')' : ''), tflId: hasTfl ? s.id : '', crs, lat: s.lat, lon: s.lon, walk: walkMin(s.dist), platform: s.rail ? 2 : 0.5, bus: !s.rail}, true);
  }));
}
function placeCard(p) {
  return `<div class="place" data-id="${esc(p.id)}"><header><span>${esc(p.name)}</span><button data-del="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">Remove</button></header>
  <div class="stepper"><span>Walk from home</span><button data-step="-1" aria-label="One minute less">−</button><b data-wv>${esc(p.walk)} min</b><button data-step="1" aria-label="One minute more">+</button></div>
  <div class="modes">${MODES.map(m => `<label><input type="checkbox" data-mode="${m.k}" ${p.modes?.[m.k] !== false ? 'checked' : ''}>${m.label}</label>`).join('')}</div>
  <details><summary>Options</summary><div class="grid2">
    <div class="field"><label>Entrance to platform or stop (minutes)</label><input type="number" min="0" max="20" step="0.5" data-k="platform" value="${esc(p.platform)}"></div>
    <div class="field"><label>Only show (routes, places or platforms)</label><input data-k="only" value="${esc(p.only || '')}" placeholder="e.g. 103, Heathrow"></div>
    <div class="field"><label>National Rail code</label><input data-k="crs" maxlength="3" value="${esc(p.crs || '')}"></div></div></details>
  ${p.learned && Object.keys(p.learned).length ? `<p class="note">Learned from your trips: ${Object.entries(p.learned).map(([k, v]) => esc(k) + ' ' + v.toFixed(1) + ' min').join(', ')}</p>` : ''}</div>`;
}
function bindPlaces() {
  document.querySelectorAll('.place').forEach(el => {
    const p = cfg.places.find(q => q.id === el.dataset.id); if (!p) return;
    el.querySelectorAll('[data-k]').forEach(i => i.addEventListener('change', () => { const k = i.dataset.k; p[k] = (k === 'only' || k === 'crs') ? i.value.trim() : parseFloat(i.value) || 0; save(); }));
    el.querySelectorAll('[data-mode]').forEach(i => i.addEventListener('change', () => { p.modes = p.modes || {}; p.modes[i.dataset.mode] = i.checked; save(); }));
    el.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { p.walk = Math.max(0, (+p.walk || 0) + +b.dataset.step); el.querySelector('[data-wv]').textContent = p.walk + ' min'; save(); }));
    el.querySelector('[data-del]').addEventListener('click', () => { cfg.places = cfg.places.filter(q => q !== p); save(); drawSetup(); });
  });
}
async function search(q) {
  const res = $('#res'); q = q.trim(); if (q.length < 3) { res.innerHTML = ''; return; }
  res.innerHTML = '<p class="note">Searching…</p>';
  try {
    const r = await getJSON(TFL + '/StopPoint/Search/' + encodeURIComponent(q) + '?modes=bus,elizabeth-line,tube,overground,dlr,national-rail,tram&maxResults=8');
    if (!r.matches?.length) { res.innerHTML = '<p class="note">No matches.</p>'; return; }
    res.innerHTML = r.matches.map((m, i) => `<button data-i="${i}"><b>${esc(m.name)}</b><span class="note">${esc((m.modes || []).join(', '))}</span></button>`).join('');
    res.querySelectorAll('button').forEach(b => b.addEventListener('click', () => pick(r.matches[+b.dataset.i])));
  } catch (e) { res.innerHTML = '<p class="err">Search failed: ' + esc(e.message) + '</p>'; }
}
async function pick(m) {
  const res = $('#res');
  if ((m.modes || []).includes('bus') && /^490G/.test(m.id)) {
    res.innerHTML = '<p class="note">Loading the stops here…</p>';
    try {
      const sp = await getJSON(TFL + '/StopPoint/' + encodeURIComponent(m.id));
      const kids = (sp.children || []).filter(c => (c.lines || []).length);
      res.innerHTML = '<p class="note">Pick the stop on your side of the road:</p>' + kids.map((c, i) => { const tw = (c.additionalProperties || []).find(a => a.key === 'Towards')?.value || ''; return `<button data-i="${i}"><b>${esc(c.indicator || c.commonName)} · ${esc(c.commonName)}</b><span class="note">Towards ${esc(tw)} · routes ${esc(c.lines.map(l => l.name).join(', '))}</span></button>`; }).join('');
      res.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const c = kids[+b.dataset.i]; const d = cfg.home ? hav2(cfg.home[1], cfg.home[0], c.lat, c.lon) : 300; addPlace({name: c.commonName + ' (' + (c.indicator || '') + ')', tflId: c.naptanId, lat: c.lat, lon: c.lon, walk: walkMin(d), platform: 0.5, bus: true}); }));
    } catch (e) { res.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
    return;
  }
  const hasTfl = (m.modes || []).some(x => ['elizabeth-line', 'tube', 'overground', 'dlr', 'tram'].includes(x));
  const crs = (m.modes || []).includes('national-rail') ? await crsFor(m.lat, m.lon) : '';
  const d = cfg.home ? hav2(cfg.home[1], cfg.home[0], m.lat, m.lon) : 800;
  addPlace({name: m.name.replace(/ (Rail|Underground) Station$/, ''), tflId: hasTfl ? m.id : '', crs, lat: m.lat, lon: m.lon, walk: walkMin(d), platform: 2});
}
function addPlace(o, quiet) {
  cfg.places.push(Object.assign({id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), modes: {walk: true, run: true, bike: !o.bus, lift: !o.bus}, learned: {}}, o));
  save();
  if (quiet) { $('#places').innerHTML = cfg.places.map(placeCard).join(''); bindPlaces(); } else drawSetup();
}

/* ---------- wiring ---------- */
$('#setBtn').addEventListener('click', openSetup);
const liftBtn = $('#liftBtn');
const syncLift = () => liftBtn.setAttribute('aria-pressed', String(!!cfg.liftOn));
liftBtn.addEventListener('click', () => { cfg.liftOn = !cfg.liftOn; save(); syncLift(); render(); });
syncLift();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetail(); if ($('#setup').classList.contains('open')) closeSetup(); } });
let poll = null;
/* Moves-style storyline: the trips you made, how you got there and the minutes it saved you */
function drawStory() {
  const box = $('#story'), S = (cfg.story || []).filter(s => Date.now() - s.at < 7 * 864e5).sort((a, b) => b.at - a.at);
  box.hidden = !S.length; if (!S.length) return;
  const saved = S.reduce((a, s) => a + (s.saved || 0), 0), days = {};
  // energy = MET × body mass × hours (Compendium of Physical Activities); CO2 vs a petrol car at 0.17 kg/km
  const MET = {walk: 3.5, run: 9.8, bike: 7.5, lift: 1.3}, kcal = s => MET[s.mode] * cfg.kg * s.mins / 60;
  const kc = S.reduce((a, s) => a + kcal(s), 0), co2 = S.filter(s => s.mode !== 'lift' && s.dist).reduce((a, s) => a + s.dist / 1000 * 0.17, 0), worth = saved / 60 * cfg.hourValue;
  S.forEach(s => { const k = new Date(s.at).toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'short'}); (days[k] = days[k] || []).push(s); });
  const verb = {walk: 'Walked', run: 'Ran', bike: 'Cycled', lift: 'Got a lift'};
  box.innerHTML = `<h2>Your trips</h2><p class="big2">${S.length} ${S.length === 1 ? 'trip' : 'trips'} this week${saved >= 1 ? `, ${Math.round(saved)} min saved by not just walking (worth £${worth.toFixed(2)} at £${cfg.hourValue}/h)` : ''}.</p><div class="stats"><div><b>${Math.round(kc)}</b><small>kcal burned</small></div><div><b>${co2.toFixed(1)}</b><small>kg CO₂ saved vs a car</small></div><div><b>${Math.round(saved)}</b><small>min saved</small></div></div>` +
    Object.entries(days).map(([k, list]) => `<h3>${esc(k)}</h3><ol class="tl">${list.map(s => `<li><span class="tt">${hhmm(s.at - s.mins * 60000)}</span><span><b>${verb[s.mode] || 'Went'} to ${esc(s.place)}</b> in ${Math.round(s.mins)} min${s.line ? `, caught the ${s.dep ? hhmm(s.dep) + ' ' : ''}${esc(s.line)}` : ''}${s.saved >= 1 ? `<br><small class="g">${Math.round(s.saved)} min faster than walking</small>` : ''}<br><small class="note">${Math.round(kcal(s))} kcal${s.dist ? ', ' + (s.dist >= 1000 ? (s.dist / 1000).toFixed(1) + ' km' : s.dist + ' m') : ''}</small></span></li>`).join('')}</ol>`).join('');
}
drawStory();
drawMoney();
const startPoll = () => { clearInterval(poll); poll = setInterval(() => { if (!document.hidden) refresh(); }, 25000); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh(); weather(); startPoll(); setInterval(weather, 600000);
requestAnimationFrame(frame);
window.__catchit = {cfg: () => cfg, deps: () => deps};
}
</script>
