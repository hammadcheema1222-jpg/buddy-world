<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Buddy World">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb3e8"/>
      <stop offset="1" stop-color="#2f6fbf"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc27a"/>
      <stop offset="1" stop-color="#f09a3e"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <!-- globe grid -->
    <g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="5">
      <circle cx="128" cy="300" r="150"/>
      <ellipse cx="128" cy="300" rx="70" ry="150"/>
      <path d="M-20 225 H276"/>
    </g>
    <!-- city skyline -->
    <g fill="#1f4f8f" opacity=".55">
      <rect x="22" y="182" width="26" height="70"/><rect x="52" y="160" width="22" height="92"/><rect x="180" y="170" width="24" height="82"/><rect x="208" y="150" width="26" height="102"/>
      <rect x="62" y="140" width="5" height="22"/><polygon points="221,150 221,128 225,120 229,128 229,150"/>
    </g>
  </g>
  <!-- map pin with Buddy's face -->
  <path d="M128 228 C 96 186 62 160 62 118 a66 66 0 0 1 132 0 c0 42 -34 68 -66 110z" fill="#ffffff"/>
  <path d="M128 216 C 100 180 74 156 74 118 a54 54 0 0 1 108 0 c0 38 -26 62 -54 98z" fill="url(#fur)"/>
  <!-- ears -->
  <path d="M84 92 L92 50 L118 76 Z" fill="#f09a3e"/><path d="M172 92 L164 50 L138 76 Z" fill="#f09a3e"/>
  <path d="M92 84 L96 62 L110 76 Z" fill="#ffd9e0"/><path d="M164 84 L160 62 L146 76 Z" fill="#ffd9e0"/>
  <!-- face -->
  <ellipse cx="128" cy="138" rx="30" ry="22" fill="#fff4e4"/>
  <circle cx="106" cy="114" r="9" fill="#2b1d10"/><circle cx="150" cy="114" r="9" fill="#2b1d10"/>
  <circle cx="109" cy="111" r="3" fill="#fff"/><circle cx="153" cy="111" r="3" fill="#fff"/>
  <path d="M122 130 h12 l-6 7z" fill="#e0607a"/>
  <path d="M128 137 q-6 9 -14 4 M128 137 q6 9 14 4" fill="none" stroke="#2b1d10" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94" cy="136" r="7" fill="#ff9aa8" opacity=".6"/><circle cx="162" cy="136" r="7" fill="#ff9aa8" opacity=".6"/>
</svg>
